<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div>
        <p>
        <h2>☁️ My Weather App
            <input type="text" placeholder="Search any city">
            <input type="button" value="Search">
            <input type="button" value="My location">
            <select name="No saved cities" id="btn"></select>
        </h2>

        </p>
    </div>

    <div>
        <p>
            <input type="button" value="°C">
            <input type="button" value="°F">
        </p>
    </div>

    <div>
        <p>
            <input type="button" value="Km/h">
            <input type="button" value="mph">
            <input type="button" value="m/s">
        </p>
    </div>




    <script src="app.js"></script>
</body>

</html>
